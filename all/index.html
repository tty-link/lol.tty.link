<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All pages | tty.link</title>
<meta name="description" content="Every computer joke that plays on LOL, the tty.link joke stage.">

<meta name="color-scheme" content="light">

<meta property="og:site_name" content="LOL :) tty.link">
<meta property="og:url" content="https://lol.tty.link/all/">
<meta property="og:title" content="All pages | LOL">
<meta property="og:description" content="Every computer joke on LOL, the tty.link joke stage. Making fun to make happy :)">
<meta property="og:image" content="https://lol.tty.link/cards/lol.jpg">
<meta property="og:image:width" content="1200">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd84a'/%3E%3Ctext x='32' y='44' font-family='ui-monospace,Menlo,monospace' font-size='34' font-weight='700' text-anchor='middle' fill='%231b2b7a'%3E:)%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:wght,CASL,MONO@300..1000,0..1,0..1&display=swap">
<style>
  /* Every page from pages/index.json as a card with a still of the page (posters/<id>.<lang>.jpg).
     Pointing at a card, or moving to it with the keyboard, plays the page itself in its place,
     one at a time. A page without a still yet plays as soon as its card is on screen. */
  :root {
    --sun: #ffd84a;
    --ink: #1b2b7a;
    --ink-soft: rgba(27, 43, 122, .72);
    --pad: clamp(16px, 3.4vw, 48px);
    --latin: 'Recursive', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  font-kku * { margin: revert-layer; padding: revert-layer; box-sizing: revert-layer; }
  body {
    min-height: 100vh;
    padding: var(--pad);
    background: var(--sun);
    color: var(--ink);
    font-family: var(--latin);
    font-variation-settings: 'MONO' 1, 'CASL' 0;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--sun); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 6px; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .mark { font-size: 18px; line-height: 1.9; color: inherit; text-decoration: none; }
  .top-end { display: flex; align-items: center; gap: 18px; }
  .top-end a { color: inherit; font-weight: 600; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  .langs { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .langs button { min-height: 33px; padding: 0 12px; border: 0; background: transparent; font-size: 14px; font-weight: 600; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--ink); color: var(--sun); }
  .hankey ~ .langs { display: none; }

  .head { margin: clamp(40px, 9vh, 96px) 0 clamp(28px, 5vh, 48px); }
  /* Drawn like the tty.link pages: the stroke alphabet for Latin, font-kku for Hangul. */
  h1 { font-size: clamp(40px, 7vw, 88px); font-weight: 750; line-height: 1; font-variation-settings: 'MONO' 1, 'CASL' 1; }
  h1 .lt { --lt: clamp(40px, 6.4vw, 84px) !important; }
  .lede { max-width: 34em; margin-top: 16px; font-size: clamp(15px, 1.4vw, 18px); line-height: 1.5; color: var(--ink-soft); }
  .lede .lt { --lt: clamp(15px, 1.4vw, 18px) !important; }
  .lede .lt-art { row-gap: .5em; }
  .lang-ko .lede { word-break: keep-all; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: clamp(28px, 3.4vw, 44px) clamp(20px, 2.6vw, 36px);
    padding: 0;
    list-style: none;
  }
  .grid > li { position: relative; }
  .card { display: block; color: inherit; text-decoration: none; }
  /* "Why is this funny?" sits on the preview's corner, outside the card link. Same "?" as the
     corner button of a page opened on its own (pages/_kit.js): sun fill, thin ink ring. */
  .ask {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--sun);
    font: 800 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(27, 43, 122, .25), 0 2px 8px rgba(0, 0, 0, .15);
  }
  .ask:hover { background: var(--ink); color: var(--sun); }
  .preview {
    --s: .3;
    position: relative;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 14px;
    background: var(--ink);
    box-shadow: 0 0 0 1.5px var(--ink);
  }
  .preview img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .preview iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1000px;
    height: 750px;
    border: 0;
    transform: scale(var(--s));
    transform-origin: 0 0;
    pointer-events: none;
  }
  .card-title { margin-top: 14px; font-size: 16px; font-weight: 700; line-height: 1.3; }
  .card-sum { margin-top: 4px; font-size: 14px; line-height: 1.45; color: var(--ink-soft); }
  .lang-ko .card-sum { word-break: keep-all; }
  .card:hover .card-title { text-decoration: underline; text-underline-offset: .2em; text-decoration-thickness: 2px; }
  .card:hover .preview { box-shadow: 0 0 0 3px var(--ink); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@tty.link/font-kku@0.1.4-rc.4/font-kku.js" data-fonts="sebul" data-addons="motion"></script>
<script src="/assets/tty-glyphs.js?v=lol-wordmark-1"></script>
<script src="/assets/lettering.js?v=remote-1"></script>
<script src="/assets/hankey.js?v=remote-1"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "838288248cb7432382fa48f87d722c3f", "spa": false}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
<header class="top">
  <a class="mark" href="/" aria-label="LOL">LOL :)</a>
  <div class="top-end">
  <a class="home" href="https://tty.link/">tty.link ↗</a>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
    <button type="button" data-lang="ko" aria-pressed="false" lang="ko">한국어</button>
  </div>
  </div>
</header>
<main>
  <div class="head">
    <h1></h1>
    <p class="lede"></p>
  </div>
  <ul class="grid"></ul>
</main>
<script>
(() => {
  window.TTYGlyphs?.wordmark(document.querySelector('.mark'), null, ['LOL', ':)']);
  const root = document.documentElement;
  const h1 = document.querySelector('h1');
  const lede = document.querySelector('.lede');
  const grid = document.querySelector('.grid');
  const read = (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } };
  const write = (key, value) => { try { localStorage.setItem(key, value); } catch (e) { /* storage blocked */ } };

  let lang = new URLSearchParams(location.search).get('lang') || read('tty.lang');
  if (lang !== 'en' && lang !== 'ko') lang = (navigator.languages || [navigator.language || '']).some((l) => /^ko\b/i.test(l)) ? 'ko' : 'en';

  const TEXT = {
    en: {
      title: 'All pages',
      lede: (n) => `${n} pages so far. On the home page they play one at a time, in random order, and more keep coming.`,
      langs: 'Language',
      ask: 'Why is this funny?',
    },
    ko: {
      title: '전체 페이지',
      lede: (n) => `지금까지 ${n}개예요. 홈에서는 무작위로 하나씩 나오고, 계속 늘어납니다.`,
      langs: '언어',
      ask: '이게 왜 웃겨요?',
    },
  };

  // The explanation dialog (/assets/tty-explain.js) is loaded the first time a "?" is pressed.
  let explainScript = null;
  const loadExplain = () => explainScript || (explainScript = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = '/assets/tty-explain.js';
    script.onload = resolve;
    script.onerror = () => { explainScript = null; reject(); };
    document.head.append(script);
  }));

  let pages = [];
  let key = null;

  // A card shows its still. Pointing at it (or reaching it with the keyboard) plays the page itself
  // over the still, one card at a time; leaving it puts the still back. A card without a still yet
  // (a page just added) plays while it is on screen, as every card once did.
  let live = null;
  const play = (preview) => {
    if (preview.querySelector('iframe')) return;
    const frame = document.createElement('iframe');
    frame.src = preview.dataset.src;
    frame.tabIndex = -1;
    frame.title = '';
    frame.setAttribute('aria-hidden', 'true');
    frame.addEventListener('load', () => setTimeout(() => {
      if (frame.contentWindow) frame.contentWindow.postMessage({ source: 'tty-home', type: 'show' }, location.origin);
    }, 300), { once: true });
    preview.append(frame);
  };
  const still = (preview) => { const frame = preview.querySelector('iframe'); if (frame) frame.remove(); };
  const timers = new WeakMap();
  const start = (preview) => {
    clearTimeout(timers.get(preview));
    timers.set(preview, setTimeout(() => {
      if (live && live !== preview) still(live);
      live = preview;
      play(preview);
    }, 250));
  };
  const stop = (preview) => {
    clearTimeout(timers.get(preview));
    timers.set(preview, setTimeout(() => { still(preview); if (live === preview) live = null; }, 300));
  };
  const loader = new IntersectionObserver((entries) => {
    entries.forEach(({ target, isIntersecting }) => {
      if (!target.classList.contains('bare')) return;
      clearTimeout(timers.get(target));
      if (isIntersecting) timers.set(target, setTimeout(() => play(target), 250));
      else timers.set(target, setTimeout(() => still(target), 1200));
    });
  }, { rootMargin: '80px 0px' });
  const scaler = new ResizeObserver((entries) => {
    entries.forEach((entry) => entry.target.style.setProperty('--s', entry.contentRect.width / 1000));
  });
  // Card titles are drawn as they come near the screen (48 at once would hold the page up).
  const drawer = new IntersectionObserver((entries) => {
    entries.forEach(({ target, isIntersecting }) => {
      if (!isIntersecting || !window.TTYLetter) return;
      drawer.unobserve(target);
      window.TTYLetter.set(target, target.textContent, { size: '16px' });
    });
  }, { rootMargin: '200px 0px' });

  function render() {
    const t = TEXT[lang];
    root.lang = lang;
    root.classList.toggle('lang-ko', lang === 'ko');
    document.title = `${t.title} | LOL`;
    document.querySelector('.langs').setAttribute('aria-label', t.langs);
    document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    h1.setAttribute('lang', lang);
    if (window.TTYLetter) {
      window.TTYLetter.set(h1, t.title, { size: '84px', animate: true });
      window.TTYLetter.set(lede, t.lede(pages.length), { size: '18px' });
    } else {
      h1.textContent = t.title;
      lede.textContent = t.lede(pages.length);
    }
    if (key) key.update(lang);

    loader.disconnect();
    scaler.disconnect();
    drawer.disconnect();
    live = null;
    // Newest first: pages are appended to the end of index.json.
    grid.replaceChildren(...pages.slice().reverse().map((page) => {
      const pick = (pair) => (pair && (pair[lang] || pair.en)) || '';
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'card';
      a.href = `/pages/${page.file}?lang=${lang}`;
      const preview = document.createElement('div');
      preview.className = 'preview';
      preview.dataset.src = `/pages/${page.file}?lang=${lang}`;
      const img = document.createElement('img');
      img.src = `/posters/${page.id}.${lang}.jpg`;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.width = 640;
      img.height = 480;
      img.addEventListener('error', () => { img.remove(); preview.classList.add('bare'); loader.observe(preview); }, { once: true });
      preview.append(img);
      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = pick(page.title) || page.id;
      const summary = document.createElement('p');
      summary.className = 'card-sum';
      summary.textContent = pick(page.summary);
      a.append(preview, title, summary);
      const ask = document.createElement('button');
      ask.type = 'button';
      ask.className = 'ask';
      ask.textContent = '?';
      ask.title = t.ask;
      ask.setAttribute('aria-label', `${t.ask} ${title.textContent}`);
      ask.setAttribute('aria-haspopup', 'dialog');
      ask.addEventListener('click', () => loadExplain().then(() => window.TTYExplain && window.TTYExplain.open({
        id: page.id, lang, title: title.textContent, returnFocus: ask,
      }), () => {}));
      li.append(a, ask);
      a.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') start(preview); });
      a.addEventListener('pointerleave', () => stop(preview));
      a.addEventListener('focus', () => start(preview));
      a.addEventListener('blur', () => stop(preview));
      scaler.observe(preview);
      drawer.observe(title);
      return li;
    }));
  }

  const switchTo = (target) => {
    if (target === lang) return;
    lang = target;
    write('tty.lang', lang);
    history.replaceState(null, '', '?lang=' + lang);
    render();
  };
  document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => switchTo(b.dataset.lang)));
  // The Han/Eng key of the tty.link pages; the buttons above stay for a page without it.
  key = window.TTYHanKey ? window.TTYHanKey.make(switchTo) : null;
  if (key) document.querySelector('.langs').before(key.button);

  fetch('/pages/index.json', { cache: 'no-cache' })
    .then((r) => r.json())
    .then((data) => { pages = data.pages || []; render(); })
    .catch(() => { pages = []; render(); });
})();
</script>
</body>
</html>
