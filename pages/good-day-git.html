<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today, Merged | tty.link</title>
<script src="/pages/_kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Martian+Mono:wdth,wght@75..112.5,500..700&family=Gowun+Dodum&display=swap">
<script src="https://font.tty.link/lib/font-kku.js" data-fonts="dunggeun pilgi"></script>
<style>
  /* A good day as a commit graph, drawn the way a metro map is: coloured lines, stations,
     interchanges where branches merge back. A train runs the day from wake-up to the tag.
     Each branch has its own little train: the lunch train and the main train reach the lunch
     merge at the same moment and bump (the day's only conflict: main had a cookie at 11:00,
     the branch had lunch and cake, both changed the stomach), then couple up and go on
     together; the walk train joins at the walk merge without a bump, to a green tick. */
  :root {
    --paper: #f5f4ef;
    --ink: #1d1d22;
    --muted: #6d6b72;
    --main: #00a84d;
    --lunch: #ef7c1c;
    --walk: #996cac;
    --conflict: #e5484d;
  }
  /* --t: the size of the map's title strip and of the lunch merge's two lines, which carry the
     joke. Worked out once on .page against the stage, then inherited in px into the map, so the
     lunch merge is never smaller than the title (and the title is a metro map's caption, not a
     poster headline). Phones: 11.5 px on the 288 px stage of a 320 px phone, where "CONFLICT
     (content): stomach" still fits one line; 12.5 px from 312 px. */
  @property --t { syntax: '<length>'; inherits: true; initial-value: 12px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    container: stage / size;
    overflow: clip;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Bricolage Grotesque', 'Gowun Dodum', system-ui, sans-serif;
  }
  .lang-ko body { word-break: keep-all; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }

  .page {
    --t: clamp(11.5px, 4cqw, 12.5px);
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    padding: 4.5cqmin 5cqmin 3.6cqmin;
    gap: 2cqmin;
  }
  @container stage (min-width: 420px) and (min-height: 560px) {
    .page { --t: clamp(13px, 2.2cqmin, 18px); }
  }
  /* The title strip: the title in a black plate like the tag at the end of the line, the
     subtitle beside or under it, both at --t. Weight and the plate make it the heading. */
  .top { display: flex; justify-content: space-between; align-items: start; gap: 2cqmin; }
  .top .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .35em .7em; min-width: 0; }
  .top h1 { display: inline-block; padding: .22em .6em .26em; border-radius: .45em; background: var(--ink); color: #fff; font-weight: 800; font-size: var(--t); line-height: 1.1; letter-spacing: .03em; font-variation-settings: 'opsz' 12; white-space: nowrap; }
  .top p { font-size: var(--t); line-height: 1.25; font-weight: 500; color: var(--muted); text-wrap: pretty; }
  .top p .short { display: none; }
  .lang-ko .top p { font-family: 'Gowun Dodum', sans-serif; }
  /* dunggeun is drawn from a jamo sheet; a hairline shadow on both sides gives the title weight */
  .top .bold { color: #fff; filter: drop-shadow(.03em 0 0 currentColor) drop-shadow(-.03em 0 0 currentColor); }
  .replay {
    flex: none;
    min-height: max(32px, calc(var(--t) * 2.7));
    padding: 0 1em;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: #fff;
    font-weight: 700;
    font-size: var(--t);
    cursor: pointer;
  }
  /* (only where there is a real pointer: on a phone a tapped button would stay black) */
  @media (hover: hover) { .replay:hover { background: var(--ink); color: #fff; } }
  .lang-ko .replay { font-family: 'Gowun Dodum', sans-serif; }

  .map { display: grid; place-items: center; min-height: 0; container-type: size; }
  .rig { position: relative; container-type: size; }
  .rig svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .line { fill: none; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
  .station { fill: #fff; stroke: var(--ink); stroke-width: 5; transform-box: fill-box; transform-origin: center; }
  .station.swap { stroke-width: 7; }
  .station.conflict { stroke: var(--conflict); }
  .bonk .pop { transform-box: fill-box; transform-origin: center; }

  /* The wide map is used only where its labels come out at 10.5 px or more (the script picks the
     layout), so the floors are plain 10 px. */
  .label {
    position: absolute;
    width: max-content;
    max-width: var(--w, 15%);
    font-size: 1.75cqw;
    line-height: 1.22;
    text-wrap: pretty;
  }
  .label .time { display: block; font-family: 'Martian Mono', monospace; font-weight: 500; font-size: max(.74em, 10px); color: var(--muted); letter-spacing: .02em; }
  .label .msg { display: block; font-weight: 700; }
  .label .type { font-family: 'Martian Mono', monospace; font-weight: 700; font-size: max(.78em, 10px); color: var(--c, var(--main)); }
  .label .diff { display: block; margin-top: .2em; font-family: 'Martian Mono', monospace; font-weight: 500; font-size: max(.7em, 10px); color: var(--muted); }
  .label .nw { white-space: nowrap; }
  /* the wide map's labels are narrow and centred: balanced lines, no word left alone */
  .rig:not(.portrait) .label { text-wrap: balance; }
  /* The lunch merge's two lines carry the joke: at --t (never smaller than the title) or the
     label's own size, in Martian Mono's condensed width (.6 em a letter instead of .7) so the
     conflict keeps to one line on phones. "Accept Both Changes" has its line from the start,
     hidden until the conflict is resolved, so nothing moves when the punch lands. Then the
     conflict stays, struck out, above its resolution. */
  .label.knot .diff { font-size: max(var(--t), 1em); font-stretch: 75%; letter-spacing: 0; }
  .label.knot .conf, .label.knot .fix { display: block; }
  .label.knot .conf { color: var(--muted); font-weight: 500; text-decoration: line-through var(--conflict); text-decoration-thickness: max(1px, .08em); text-wrap: balance; }
  .label.knot .fix { color: var(--main); font-weight: 700; }
  .label.knot.open .conf { color: var(--conflict); font-weight: 700; text-decoration: none; }
  .label.knot.open .fix { visibility: hidden; }
  .label.tag .msg { display: inline-block; padding: .25em .6em; background: var(--ink); color: #fff; border-radius: .4em; }
  .label.tag .type { color: #8ff0b6; }
  .label.tag .text { margin-left: .35em; }
  /* The tall map (phones, and every stage too small for the wide one's labels): labels at
     10.5 px or more (times and prefixes 10 px) to the right of the line, the map at the left so
     they can run on into the room beside it (--spare, set by the script). The script spaces the
     stations for the labels' real heights, so a label that wraps pushes its neighbours apart
     instead of running into them, and a tall stage stretches the line to fill it. Only a few
     diffs are shown: the lunch merge (conflict and resolution), the dessert's "0 tests" and
     "shipped". The lunch merge's two lines and the tag stay on one line each (nowrap). Times,
     prefixes and diffs take Martian Mono's condensed width here too: on the 288 px stage of a
     320 px phone that is what keeps "shipped" inside the stage. */
  .rig.portrait { justify-self: start; }
  .portrait .label { font-size: max(3.3cqw, 10.5px); line-height: 1.18; }
  .portrait .label :is(.time, .type, .diff) { font-stretch: 75%; }
  .portrait .label .time { display: inline; margin-right: .5em; font-size: max(.74em, 10px); }
  .portrait .label .type { font-size: max(.78em, 10px); }
  .portrait .label .msg { display: inline; }
  .portrait .label .diff { display: none; }
  .portrait .label.knot .diff, .portrait .label.always .diff { display: block; margin-top: .1em; font-size: max(.74em, 10px); }
  .portrait .label.knot .diff { font-size: max(var(--t), 1em); line-height: 1.1; margin-top: 0; white-space: nowrap; }
  .portrait .label.tag .diff { display: inline; margin: 0 0 0 .5em; font-size: max(.74em, 10px); }
  .portrait .label.tag { white-space: nowrap; }
  .portrait .label.quiet { display: none; }
  /* short screens: the subtitle takes its short form (it sets up the bump), the legend goes */
  @container stage (max-height: 640px) {
    .top p .long { display: none; }
    .top p .short { display: inline; }
    .page .legend { display: none; }
  }

  .legend { display: flex; flex-wrap: wrap; gap: .6em 1.6em; font-family: 'Martian Mono', monospace; font-weight: 500; font-size: clamp(11px, 1.9cqmin, 15px); color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: .55em; }
  .legend i { display: inline-block; width: 2.2em; height: .55em; border-radius: 1em; background: var(--c); }

  /* Opened on its own, the tty.link nav takes the bottom right; the labels of the lower line
     (15:00 hangs lowest) stay above it. */
  html:not(.embedded) .page { padding-bottom: calc(3.6cqmin + 34px); }

  .hidden { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .hidden { opacity: 1; } }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="head">
      <h1 data-lang="en">Today, merged.</h1>
      <h1 data-lang="ko" aria-label="오늘, 머지 완료."><font-kku class="bold" font="dunggeun" size="var(--t)">오늘, 머지 완료.</font-kku></h1>
      <p data-lang="en" data-tty-line="setup"><span class="long">A day with zero conflicts. Well, almost.</span><span class="short">Zero conflicts. Well, almost.</span></p>
      <p data-lang="ko" data-tty-line="setup">충돌 하나 없던 하루. 음, 거의요.</p>
    </div>
    <button class="replay" type="button"><span data-lang="en">Replay the day</span><span data-lang="ko">하루 다시 보기</span></button>
  </header>

  <div class="map"><div class="rig">
    <svg aria-hidden="true">
      <g class="lines"></g>
      <g class="stations"></g>
      <!-- one train per line; the main one last, on top -->
      <g class="train" data-line="walk"><g class="car"><rect x="-17" y="-11" width="34" height="22" rx="11" fill="var(--walk)" stroke="var(--ink)" stroke-width="3"/><rect x="2" y="-5" width="9" height="10" rx="2" fill="#fff"/></g></g>
      <g class="train" data-line="lunch"><g class="car"><rect x="-17" y="-11" width="34" height="22" rx="11" fill="var(--lunch)" stroke="var(--ink)" stroke-width="3"/><rect x="2" y="-5" width="9" height="10" rx="2" fill="#fff"/></g></g>
      <g class="train" data-line="main"><g class="car"><rect x="-17" y="-11" width="34" height="22" rx="11" fill="var(--ink)"/><rect x="2" y="-5" width="9" height="10" rx="2" fill="#fff"/></g></g>
      <!-- the bump at the lunch merge: a red "!", then a green tick -->
      <g class="bonk" opacity="0"><g class="pop">
        <path class="star" fill="var(--conflict)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
        <g class="bang" fill="#fff"><rect x="-3.2" y="-15" width="6.4" height="17" rx="3.2"/><circle cy="9" r="3.6"/></g>
        <path class="tick" d="M-10 0 L-3 7 L11 -8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
      </g></g>
    </svg>
  </div></div>

  <footer class="legend" aria-hidden="true">
    <span style="--c: var(--main)"><i></i>main</span>
    <span style="--c: var(--lunch)"><i></i>lunch-with-friends</span>
    <span style="--c: var(--walk)"><i></i>go-outside</span>
  </footer>
</main>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (s) => document.querySelector(s);
  const ko = TTY.lang === 'ko';

  // The day, in commit order. type + message + what changed. Merge commits keep git's own
  // message (in English in both languages, as git writes it); the lunch merge has a conflict.
  const COMMITS = [
    { id: 'wake', line: 'main', time: '07:00', type: 'feat:', en: 'wake up without an alarm', ko: '알람 없이 기상', diff: ['+8h sleep, −3 snoozes', '+수면 8시간, −스누즈 3번'] },
    { id: 'coffee', line: 'main', time: '07:40', type: 'fix:', en: 'coffee temperature regression', ko: '커피 온도 회귀 버그', diff: ['+3°C, −1 sigh', '+3°C, −한숨 1'] },
    { id: 'plants', line: 'main', time: '09:10', type: 'chore:', en: 'water the plants', ko: '화분에 물 주기', diff: ['3 pots changed, +500 ml', '화분 3개 변경, +500ml'] },
    // main touches the stomach while the lunch branch is out: that is what makes 13:10 a real conflict
    { id: 'cookie', line: 'main', time: '11:00', type: 'feat:', en: 'one cookie before lunch', ko: '점심 전에 쿠키 하나', diff: ['+1 cookie', '+쿠키 1'] },
    { id: 'lunch', line: 'lunch', time: '12:00', type: 'feat:', en: 'lunch with friends', ko: '친구들이랑 점심', diff: ['+3 friends', '+친구 3명'] },
    { id: 'dessert', line: 'lunch', time: '12:40', type: 'feat:', en: 'extra dessert (not in spec)', ko: '디저트 추가 (기획에 없음)', diff: ['+1 cake, 0 tests', '+케이크 1, 테스트 0'], always: true },
    { id: 'merge-lunch', line: 'main', swap: 'lunch', time: '13:10', type: 'Merge', git: "branch 'lunch-with-friends'", diff: ['Accept Both Changes', '두 변경 사항 모두 수락'], conflict: ['CONFLICT (content): stomach', 'CONFLICT (content): 배'] },
    { id: 'walk', line: 'walk', time: '15:00', type: 'refactor:', en: 'replace doomscrolling with a walk', ko: '둠스크롤링을 산책으로 교체', diff: ['−47 min feed, +6,214 steps', '−피드 47분, +6,214걸음'] },
    { id: 'merge-walk', line: 'main', swap: 'walk', time: '15:40', type: 'Merge', git: "branch 'go-outside'", diff: ['+2 dogs petted', '+강아지 2마리 쓰다듬음'] },
    { id: 'docs', line: 'main', time: '17:20', type: 'docs:', en: 'tell someone they did great', ko: '잘했다고 말해 주기', diff: ['+1 compliment', '+칭찬 1'] },
    { id: 'revert', line: 'main', time: '19:30', type: 'revert:', en: '“push dinner to next sprint”', ko: '“저녁은 다음 스프린트에”', diff: ['+1 proper dinner', '+제대로 된 저녁 1끼'], fold: ['+1 proper', '+제대로 된'] },
    { id: 'tag', line: 'main', tag: true, time: '22:30', type: 'v1.0', en: 'a good day', ko: '좋은 하루', diff: ['shipped', '배포 완료'] },
  ];

  // Two maps of the same day: a looped line for wide screens, a straight one for tall ones.
  const LAYOUTS = {
    landscape: {
      w: 1000, h: 660,
      lines: {
        main: 'M70 200 H870 Q940 200 940 270 V380 Q940 450 870 450 H120',
        lunch: 'M470 200 L560 110 H700 L790 200',
        walk: 'M860 450 L770 540 H650 L560 450',
      },
      // [x, y, side, max label width in % of the map]. Stations on a row are 14–16% apart, so
      // their labels are kept narrower than that. The evening labels hang under the lower line,
      // where nothing else is, so they never meet the morning labels in the middle band.
      // 15:40 is wide enough for its git message on one line, so it stands one line lower under
      // 11:00; 17:20 sits 165 units from 19:30, whose diff folds (see `fold`) rather than run
      // into it, and short of the walk merge's tick at x 521.
      at: {
        wake: [110, 200, 'below', 13.5], coffee: [260, 200, 'below', 13.5], plants: [410, 200, 'below', 13.5],
        cookie: [600, 200, 'below', 12],
        lunch: [580, 110, 'above-end'], dessert: [680, 110, 'above-start'],
        // short of the loop at x 933: the conflict folds into two balanced lines when it is
        // wider than that (Martian Mono condensed is .6 em a letter)
        'merge-lunch': [800, 200, 'below', 25],
        walk: [710, 540, 'below'],
        'merge-walk': [560, 450, 'above', 23], docs: [445, 450, 'below', 12.8], revert: [280, 450, 'below', 13.5], tag: [120, 450, 'below', 15],
      },
      bonk: [14, -46], // where the "!" goes, from the lunch junction
      tick: [-14, 46], // and the clean merge's tick, from the walk junction (under the line, clear of 15:40)
      car: 1.15, // train size
    },
    portrait: {
      w: 600, h: 760,
      // Where each station would like to be (y, on a 760-unit line): one-line labels 45–52 apart,
      // two-line ones (12:40, and on narrow stages 07:40, 15:00, 17:20, 19:30) 58–64, the
      // three-line lunch merge 96–98 either side. `place()` stretches these to the stage and
      // pushes stations apart where their labels are taller than the room between them.
      at: {
        wake: 26, coffee: 84, plants: 136, cookie: 181,
        lunch: 226, dessert: 290,
        'merge-lunch': 388,
        walk: 484,
        'merge-walk': 548, docs: 593, revert: 654, tag: 712,
      },
      // the least room between a station and the one before it, for the branches' diagonals: the
      // lunch branch leaves main between 09:10 and 11:00 (the cookie is main's, after the fork),
      // 12:00 and 12:40 sit on its straight part, it rejoins 20 units before 13:10; the walk branch
      // leaves after 13:10 and rejoins 14 units before 15:40
      room: { cookie: 43, lunch: 33, dessert: 20, 'merge-lunch': 76, walk: 76, 'merge-walk': 48 },
      bonk: [-50, -20],
      tick: [-50, -20],
      car: 1.45, // the tall map is drawn small; the trains are drawn larger on it
    },
  };
  const PORTRAIT_X = { main: 70, branch: 150 };
  const LABEL_GAP = 4; // px between the text of two neighbouring labels on the tall map
  // On a tall map too short for every label (a 360 x 520 phone's 328 x 288 stage) these go
  // quiet, in this order, and keep only their station: the commits the conflict needs (the
  // cookie, lunch, dessert, the two merges) and the tag always keep theirs.
  const QUIET = ['plants', 'wake', 'docs', 'coffee', 'revert', 'walk'];

  const map = $('.map'), pageEl = $('.page');
  const rig = $('.rig');
  const svgEl = $('.rig svg');
  const linesG = $('.lines');
  const stationsG = $('.stations');
  const trains = Object.fromEntries([...document.querySelectorAll('.train')].map((g) => [g.dataset.line, g]));
  const bonk = $('.bonk');
  // a ten-pointed burst
  $('.bonk .star').setAttribute('d', [...Array(20)].map((_, i) => {
    const a = (i / 20) * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 17 : 27;
    return (i ? 'L' : 'M') + (Math.cos(a) * r).toFixed(1) + ' ' + (Math.sin(a) * r).toFixed(1);
  }).join(' ') + 'Z');
  const COLORS = { main: 'var(--main)', lunch: 'var(--lunch)', walk: 'var(--walk)' };
  const radius = (c) => (c.tag ? 17 : c.swap ? 14 : 10); // a station's circle: the tag, an interchange, a stop

  // The wide map only where its labels (1.75% of the map's width) come out at 10.5 px or more:
  // the map is 1000 x 660, so it needs a cell 600 px wide and 396 px high. Everything smaller
  // (a phone on its side, a 360 x 520 phone's 328 x 288 stage) gets the tall map.
  const wide = () => innerHeight <= innerWidth * 1.05 && Math.min(map.clientWidth, map.clientHeight * 1000 / 660) >= 600;

  let built = null;
  function build() {
    const portrait = !wide();
    const L = LAYOUTS[portrait ? 'portrait' : 'landscape'];
    if (built && built.L === L) return built;

    rig.classList.toggle('portrait', portrait);
    linesG.replaceChildren();
    stationsG.replaceChildren();
    rig.querySelectorAll('.label').forEach((el) => el.remove());

    const paths = {};
    // Branches under main, so the interchanges sit on top of the main line.
    ['lunch', 'walk', 'main'].forEach((name) => {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('class', 'line');
      p.setAttribute('stroke', COLORS[name]);
      linesG.append(p);
      paths[name] = p;
    });

    const items = COMMITS.map((c) => {
      const st = document.createElementNS(NS, 'circle');
      st.setAttribute('r', radius(c));
      st.setAttribute('class', 'station' + (c.swap ? ' swap' : ''));
      if (c.tag) { st.style.fill = 'var(--main)'; st.style.stroke = 'var(--ink)'; }
      stationsG.append(st);

      const label = document.createElement('div');
      label.className = 'label' + (c.tag ? ' tag' : '') + (c.conflict ? ' knot open' : '') + (c.always ? ' always' : '');
      label.style.setProperty('--c', COLORS[c.line === 'main' && c.swap ? c.swap : c.line]);
      // a diff wraps between its parts, never inside one; a one-part diff with a `fold` may also
      // wrap after that much (19:30's runs into 17:20 on small landscape stages otherwise)
      const whole = c.diff[ko ? 1 : 0], fold = c.fold && c.fold[ko ? 1 : 0];
      const parts = fold ? [fold, whole.slice(fold.length + 1)] : whole.split(', ');
      const diff = parts.map((part) => `<span class="nw">${part}</span>`).join(fold ? ' ' : ', ');
      label.innerHTML = `<span class="time">${c.time}</span><span class="msg"><span class="type">${c.type}</span> <span class="text"></span></span><span class="diff">${diff}</span>`;
      if (c.conflict) {
        // the conflict (setup) and its resolution (punch), each on its own line from the start
        const d = label.querySelector('.diff');
        d.innerHTML = '<span class="conf"></span><span class="fix"></span>';
        d.firstChild.textContent = c.conflict[ko ? 1 : 0];
        d.firstChild.dataset.ttyLine = 'setup';
        d.lastChild.textContent = whole;
        d.lastChild.dataset.ttyLine = 'punch';
      }
      const text = label.querySelector('.text');
      if (c.git) {
        // branch 'name': the line may break before the name, not at its hyphens
        const [word, name] = c.git.split(' ');
        text.innerHTML = `${word} <span class="nw"></span>`;
        text.lastChild.textContent = name;
      } else if (ko) {
        const k = document.createElement('font-kku');
        k.setAttribute('font', c.tag ? 'pilgi' : 'dunggeun');
        if (c.tag) k.style.color = '#fff';
        k.setAttribute('size', '1em');
        k.setAttribute('wrap-unit', 'word');
        k.textContent = c[TTY.lang];
        text.append(k);
      } else {
        text.textContent = c.en;
      }
      if (portrait) {
        label.style.left = (176 / L.w * 100) + '%';
        label.style.transform = 'translateY(-50%)';
        label.style.setProperty('--w', 'calc(70% + var(--spare, 0px))'); // from 29.3% into the page's right margin
      } else {
        const [x, y, side, width] = L.at[c.id];
        const px = (x / L.w) * 100, py = (y / L.h) * 100;
        const gap = (c.tag ? 32 : 26) / L.h * 100;
        label.style.left = px + '%';
        if (width) label.style.setProperty('--w', width + '%');
        if (side === 'below') { label.style.top = (py + gap) + '%'; label.style.transform = 'translateX(-50%)'; label.style.textAlign = 'center'; }
        if (side === 'above') { label.style.top = (py - gap) + '%'; label.style.transform = 'translate(-50%, -100%)'; label.style.textAlign = 'center'; }
        if (side === 'above-end') { label.style.top = (py - gap) + '%'; label.style.transform = 'translate(-88%, -100%)'; label.style.textAlign = 'right'; }
        if (side === 'above-start') { label.style.top = (py - gap) + '%'; label.style.transform = 'translate(-12%, -100%)'; }
      }
      rig.append(label);
      if (labelsSeen) labelsSeen.observe(label);
      return { c, st, label, x: 0, y: 0 };
    });
    built = { L, portrait, paths, items, H: 0, key: '' };
    return built;
  }

  // How much room the tall map leaves beside it for its labels, plus half the page's right
  // margin. On the 328 px stages of 360 px phones, whether the map is narrower than its cell
  // (328 x 408) or fills its width (328 x 468–568), that keeps 13:10's branch name and 17:20 on
  // one line; on the 312 and 288 px stages they fold to two lines and `place()` makes room.
  const spare = () => Math.max(0, map.clientWidth - rig.offsetWidth - 2) + Math.round(parseFloat(getComputedStyle(pageEl).paddingRight) / 2);

  // How far a label's text reaches above and below the middle of its box, in px: the boxes of
  // its lines of text (font-kku by its host, the tag by its plate), not the label's box, whose
  // line height is less than the letters' height.
  const range = document.createRange();
  const reach = (label) => {
    if (label.classList.contains('quiet')) return [0, 0];
    const box = label.getBoundingClientRect(), mid = (box.top + box.bottom) / 2;
    let up = 0, down = 0;
    const add = (q) => { if (q.width > 0 && q.height > 0) { up = Math.max(up, mid - q.top); down = Math.max(down, q.bottom - mid); } };
    const walk = (node) => {
      if (node.nodeType === 3) {
        if (!node.data.trim()) return;
        range.selectNodeContents(node);
        for (const q of range.getClientRects()) add(q);
        return;
      }
      if (node.nodeType !== 1 || getComputedStyle(node).display === 'none') return;
      if (node.tagName === 'FONT-KKU' || (label.classList.contains('tag') && node.classList.contains('msg'))) { for (const q of node.getClientRects()) add(q); return; }
      node.childNodes.forEach(walk);
    };
    walk(label);
    return [up, down];
  };

  // Put the stations, labels and lines where they go on the current stage. Returns true when
  // anything moved.
  function place() {
    const b = build();
    const L = b.L;
    let H = L.h;
    if (b.portrait) {
      // a tall cell stretches the line (up to 1.4 times) instead of leaving it short in the middle
      const cw = map.clientWidth, ch = map.clientHeight;
      if (cw > 0 && ch > cw * L.h / L.w) H = Math.round(Math.min(L.h * 1.4, L.w * ch / cw));
    }
    if (H !== b.H) {
      b.H = H;
      rig.style.aspectRatio = `${L.w} / ${H}`;
      rig.style.height = `min(100cqh, 100cqw * ${H} / ${L.w})`;
      svgEl.setAttribute('viewBox', `0 0 ${L.w} ${H}`);
    }
    let ys, d;
    if (!b.portrait) {
      b.items.forEach((it) => { [it.x, it.y] = L.at[it.c.id]; });
      d = L.lines;
    } else {
      rig.style.setProperty('--spare', spare() + 'px');
      const k = H / L.h;
      const rigH = rig.offsetHeight || 1, unit = H / rigH; // map units per px
      const ids = b.items.map((it) => it.c.id);
      const pref = ids.map((id) => L.at[id] * k);
      // the room the branches' diagonals need, and at least the two stations' circles and a gap
      const rad = b.items.map((it) => radius(it.c));
      const room = ids.map((id, i) => (i ? Math.max((L.room[id] || 0) * k, rad[i - 1] + rad[i] + 10) : 0));
      const n = ids.length;
      b.items.forEach((it) => it.label.classList.remove('quiet'));
      let ext, need, top, bottom, pack, quiet = 0;
      for (;;) {
        // how far each label's text reaches above and below its station (in map units)
        ext = b.items.map((it) => reach(it.label).map((v) => v * unit));
        need = (i, s) => Math.max(room[i], s * (ext[i - 1][1] + ext[i][0] + LABEL_GAP * unit));
        top = Math.max(16, ext[0][0]); bottom = H - Math.max(26, ext[n - 1][1]);
        pack = (s) => {
          const y = [Math.max(pref[0], top)];
          for (let i = 1; i < n; i++) y[i] = Math.max(pref[i], y[i - 1] + need(i, s));
          if (y[n - 1] > bottom) { y[n - 1] = bottom; for (let i = n - 2; i >= 0; i--) y[i] = Math.min(y[i], y[i + 1] - need(i + 1, s)); }
          return y;
        };
        ys = pack(1);
        if (ys[0] >= top || quiet >= QUIET.length) break;
        b.items[ids.indexOf(QUIET[quiet++])].label.classList.add('quiet');
      }
      if (ys[0] < top) {
        // too little room for every label: shrink the gaps between them evenly, the diagonals' room kept
        let lo = 0, hi = 1;
        for (let j = 0; j < 20; j++) { const s = (lo + hi) / 2; if (pack(s)[0] >= top) lo = s; else hi = s; }
        ys = pack(lo);
      }
      const at = Object.fromEntries(ids.map((id, i) => [id, ys[i]]));
      b.items.forEach((it, i) => { it.x = it.c.line === 'main' ? PORTRAIT_X.main : PORTRAIT_X.branch; it.y = ys[i]; });
      const X = PORTRAIT_X.main, B = PORTRAIT_X.branch, r = (v) => v.toFixed(1);
      const fl = Math.max(at.plants + 12 * k, Math.min(at.cookie - 29 * k, at.lunch - 60 * k));
      const jl = at['merge-lunch'] - 20 * k;
      const fw = Math.max(at['merge-lunch'] + 20 * k, at.walk - 74 * k);
      const jw = at['merge-walk'] - 14 * k;
      d = {
        main: `M${X} ${r(at.wake - 6 * k)} V${r(at.tag)}`,
        lunch: `M${X} ${r(fl)} L${B} ${r(fl + 52 * k)} V${r(jl - 46 * k)} L${X} ${r(jl)}`,
        walk: `M${X} ${r(fw)} L${B} ${r(fw + 46 * k)} V${r(jw - 24 * k)} L${X} ${r(jw)}`,
      };
      b.items.forEach((it) => { it.label.style.top = (it.y / H * 100) + '%'; });
    }
    const key = JSON.stringify(d) + b.items.map((it) => it.y.toFixed(1)).join();
    if (key === b.key) return false;
    b.key = key;
    Object.entries(d).forEach(([name, path]) => b.paths[name].setAttribute('d', path));
    b.items.forEach((it) => { it.st.setAttribute('cx', it.x); it.st.setAttribute('cy', it.y.toFixed(1)); });
    measure(b);
    return true;
  }

  // Where along its own line each station sits, so the train reaches them in time.
  const lenAt = (path, x, y) => {
    const total = path.getTotalLength();
    let best = 0, bestD = Infinity;
    for (let i = 0; i <= 400; i++) {
      const l = (total * i) / 400, p = path.getPointAtLength(l);
      const d = (p.x - x) ** 2 + (p.y - y) ** 2;
      if (d < bestD) { bestD = d; best = l; }
    }
    return best;
  };
  function measure(b) {
    const { paths } = b;
    const mainLen = paths.main.getTotalLength();
    const forkAt = (name) => {
      const p = paths[name].getPointAtLength(0);
      return lenAt(paths.main, p.x, p.y);
    };
    // where each branch rejoins the main line, as a length along it
    const joinAt = (name) => {
      const p = paths[name].getPointAtLength(paths[name].getTotalLength());
      return lenAt(paths.main, p.x, p.y);
    };
    b.items.forEach((it) => {
      const own = paths[it.c.line];
      it.on = it.c.line === 'main' ? lenAt(own, it.x, it.y) / mainLen : null;
      if (it.c.line !== 'main') it.branchFrac = lenAt(own, it.x, it.y) / own.getTotalLength();
    });
    Object.assign(b, { mainLen, forks: { lunch: forkAt('lunch'), walk: forkAt('walk') }, joins: { lunch: joinAt('lunch'), walk: joinAt('walk') } });
  }

  // The lunch merge: red while the conflict is open; then the conflict stays, struck out, with
  // the resolution in green under it, so the finished map still tells the whole joke.
  const setKnot = (it, open) => {
    it.label.classList.toggle('open', open);
    it.st.classList.toggle('conflict', open);
  };

  /* The run. The main train takes the morning slowly and gathers speed; when it passes the
     fork, the lunch train sets off down its own line, timed so that both reach the lunch merge
     at the same moment, about 2.6 s in. They bump: a red "!", the station flashes red, the
     label says CONFLICT. After HOLD_MS the conflict is resolved (a green tick, "Accept Both
     Changes"), the lunch train couples on behind and the day goes on at its old pace. The walk
     train leaves at its fork and arrives just as there is room behind the lunch car, so that
     merge needs no stop: a green tick straight away, no "!". At the terminus the whole train
     fades and the tag takes a bow. */
  // (in map units for a car of scale 1; play() scales them with the layout's car size)
  const GAP_1 = 38;         // centre to centre of coupled cars
  const MORNING_MS = 2400;  // from the start to the bump at the lunch merge
  const HOLD_MS = 2000;     // the trains wait at the conflict this long (the CONFLICT line is read here)
  const DURATION = 7600;    // the pace of the whole day (the afternoon runs on it)
  const NOSE_1 = 14;        // the main train stops this far before the junction
  const STOP_BACK_1 = 27;   // and the lunch train this far before it, on its own line
  const COUPLE_MS = 300;    // the lunch car sliding in behind
  const ease = (k) => (k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
  const unease = (e) => (e < .5 ? Math.sqrt(e / 2) : 1 - Math.sqrt(2 * (1 - e)) / 2);
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  // where a car stands at a length along a path: [x, y, angle]
  const pose = (path, len) => {
    const total = path.getTotalLength(), l = Math.min(total, Math.max(0, len));
    const p = path.getPointAtLength(l);
    const a = path.getPointAtLength(Math.max(0, l - 1)), c = path.getPointAtLength(Math.min(total, l + 1));
    return [p.x, p.y, Math.atan2(c.y - a.y, c.x - a.x) * 180 / Math.PI];
  };
  let carScale = 1;
  const put = (g, [x, y, a]) => g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(1)}) scale(${carScale})`);
  const mix = (p, q, f) => {
    let d = q[2] - p[2];
    d -= Math.round(d / 360) * 360;
    return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, p[2] + d * f];
  };
  const jolt = (g) => g.querySelector('.car').animate([{ transform: 'translate(0, 0)' }, { transform: 'translate(-7px, 0)', offset: .25 }, { transform: 'translate(1px, 0)', offset: .7 }, { transform: 'translate(0, 0)' }],
    { duration: 420, easing: 'ease-out' });

  // The three states of the map: before the run (empty line, the main train at the start), the
  // run, and the finished day (also what reduced motion shows, and what a resize after the run
  // redraws).
  let run = 0, state = 'idle';
  const clear = () => {
    run++;
    Object.values(trains).forEach((g) => { g.getAnimations({ subtree: true }).forEach((a) => a.cancel()); g.style.display = ''; g.style.opacity = ''; });
    bonk.getAnimations({ subtree: true }).forEach((a) => a.cancel());
    bonk.setAttribute('opacity', 0);
  };
  function still() {
    const b = built;
    clear();
    Object.values(b.paths).forEach((p) => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; });
    b.items.forEach((it) => { it.st.classList.remove('hidden'); it.label.classList.remove('hidden'); it.shown = true; });
    setKnot(b.items.find((it) => it.c.conflict), false);
    Object.values(trains).forEach((g) => { g.style.display = 'none'; });
  }
  function prime() {
    const b = built;
    if (TTY.reduce) return still();
    clear();
    carScale = b.L.car;
    Object.values(b.paths).forEach((p) => { const l = p.getTotalLength(); p.style.strokeDasharray = `${l} ${l}`; p.style.strokeDashoffset = l; });
    b.items.forEach((it) => { it.st.classList.add('hidden'); it.label.classList.add('hidden'); it.shown = false; });
    setKnot(b.items.find((it) => it.c.conflict), true);
    put(trains.main, pose(b.paths.main, 0));
    trains.lunch.style.visibility = trains.walk.style.visibility = 'hidden';
  }

  function play() {
    place();
    const b = built;
    if (TTY.reduce) { still(); state = 'done'; return; }
    prime();
    state = 'running';
    const me = run;
    const GAP = GAP_1 * carScale, NOSE = NOSE_1 * carScale, STOP_BACK = STOP_BACK_1 * carScale;
    const knot = b.items.find((it) => it.c.conflict);
    const lines = { main: b.paths.main, lunch: b.paths.lunch, walk: b.paths.walk };
    const totals = Object.fromEntries(Object.entries(lines).map(([k, p]) => [k, p.getTotalLength()]));
    const [jx, jy] = (() => { const p = lines.lunch.getPointAtLength(totals.lunch); return [p.x, p.y]; })();
    bonk.setAttribute('transform', `translate(${jx + b.L.bonk[0]} ${jy + b.L.bonk[1]}) scale(${carScale})`);
    $('.bonk .star').style.fill = '';
    $('.bonk .bang').style.opacity = '';
    $('.bonk .tick').style.opacity = 0;

    const draw = (k, len) => { lines[k].style.strokeDashoffset = totals[k] - Math.max(0, len); };
    const pop = (it) => {
      if (it.shown) return;
      it.shown = true;
      it.st.classList.remove('hidden');
      it.st.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.5)', offset: .6 }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.2, .9, .3, 1.3)' });
      it.label.classList.remove('hidden');
      it.label.animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 480, easing: 'cubic-bezier(.6, 0, .3, 1)' });
    };
    const popBranch = (k, len) => b.items.forEach((it) => { if (it.c.line === k && len / totals[k] >= it.branchFrac - .002) pop(it); });

    const start = performance.now() + 200;
    const tBump = start + MORNING_MS, tGo = tBump + HOLD_MS;
    const stopLen = b.joins.lunch - NOSE;
    const lunchStop = totals.lunch - STOP_BACK;
    // the afternoon: the old pace of the day, picked up where the train stopped
    const t0 = tGo - unease(stopLen / b.mainLen) * DURATION;
    const timeAt = (len) => t0 + unease(Math.min(1, len / b.mainLen)) * DURATION;
    let lunchOut = null, walkOut = null, walkIn = null, bumped = false, going = false, lunchAt = null, clean = false;
    // The walk merge, the tag beat: the same badge as the lunch merge's, but green from the
    // start and a size smaller. No stop, no "!".
    const cleanTick = () => {
      const p = lines.walk.getPointAtLength(totals.walk);
      bonk.getAnimations().forEach((a) => a.cancel());
      bonk.setAttribute('transform', `translate(${p.x + b.L.tick[0]} ${p.y + b.L.tick[1]}) scale(${carScale * .8})`);
      $('.bonk .star').style.fill = 'var(--main)';
      $('.bonk .bang').style.opacity = 0;
      $('.bonk .tick').style.opacity = 1;
      bonk.setAttribute('opacity', 1);
      $('.bonk .pop').animate([{ transform: 'scale(0) rotate(-30deg)' }, { transform: 'scale(1.2) rotate(6deg)', offset: .6 }, { transform: 'scale(1) rotate(0)' }], { duration: 340, easing: 'cubic-bezier(.2, .9, .3, 1.3)' });
      bonk.animate([{ opacity: 1 }, { opacity: 1, offset: .75 }, { opacity: 0 }], { duration: 1400, fill: 'forwards' });
    };

    const frame = (now) => {
      if (me !== run) return;
      let len;
      if (now < tBump) len = stopLen * Math.pow(clamp01((now - start) / MORNING_MS), 1.6);
      else if (now < tGo) len = stopLen;
      else len = ease(clamp01((now - t0) / DURATION)) * b.mainLen;
      draw('main', len);
      put(trains.main, pose(lines.main, len));
      b.items.forEach((it) => { if (it.on !== null && it !== knot && len >= it.on * b.mainLen - 4) pop(it); });

      // The lunch train: out at the fork, timed to meet the main train at the merge.
      if (lunchOut === null && len >= b.forks.lunch) { lunchOut = now; trains.lunch.style.visibility = ''; }
      if (lunchOut !== null && !going) {
        const l = lunchStop * Math.pow(clamp01((now - lunchOut) / Math.max(1, tBump - lunchOut)), 1.25);
        lunchAt = pose(lines.lunch, l);
        put(trains.lunch, lunchAt);
        draw('lunch', l);
        popBranch('lunch', l);
      }
      if (!bumped && now >= tBump) {
        bumped = true;
        jolt(trains.main); jolt(trains.lunch);
        rig.animate([{ translate: '0 0' }, { translate: '-3px 2px' }, { translate: '3px -1px' }, { translate: '-2px 0' }, { translate: '0 0' }], { duration: 260 });
        pop(knot);
        knot.st.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.4)' }, { transform: 'scale(1)' }], { duration: 380, delay: 120, iterations: 2, easing: 'ease-in-out' });
        bonk.setAttribute('opacity', 1);
        $('.bonk .pop').animate([{ transform: 'scale(0) rotate(-30deg)' }, { transform: 'scale(1.25) rotate(8deg)', offset: .6 }, { transform: 'scale(1) rotate(0)' }], { duration: 360, easing: 'cubic-bezier(.2, .9, .3, 1.3)' });
      }
      if (!going && now >= tGo) {
        going = true;
        draw('lunch', totals.lunch);
        setKnot(knot, false);
        knot.st.animate([{ transform: 'scale(.6)' }, { transform: 'scale(1.25)', offset: .6 }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.2, .9, .3, 1.3)' });
        $('.bonk .star').style.fill = 'var(--main)';
        $('.bonk .bang').style.opacity = 0;
        $('.bonk .tick').style.opacity = 1;
        $('.bonk .pop').animate([{ transform: 'scale(.7)' }, { transform: 'scale(1.15)', offset: .6 }, { transform: 'scale(1)' }], { duration: 320, easing: 'cubic-bezier(.2, .9, .3, 1.3)' });
        bonk.animate([{ opacity: 1 }, { opacity: 1, offset: .7 }, { opacity: 0 }], { duration: 1000, fill: 'forwards' });
      }
      if (going) {
        // coupled: the lunch car slides in behind and follows
        put(trains.lunch, mix(lunchAt, pose(lines.main, len - GAP), clamp01((now - tGo) / COUPLE_MS)));
        // The walk train: out at its fork, in just as there is room behind the lunch car.
        if (walkOut === null && len >= b.forks.walk) {
          walkOut = now;
          walkIn = Math.max(now + 300, timeAt(b.joins.walk + 2 * GAP));
          trains.walk.style.visibility = '';
        }
        if (walkOut !== null) {
          const f = clamp01((now - walkOut) / (walkIn - walkOut));
          // quick out of the fork, easing into the coupling: 15:00 comes up before 15:40 does
          const l = totals.walk * (f + .6 * f * (1 - f));
          draw('walk', l);
          popBranch('walk', l);
          put(trains.walk, f < 1 ? pose(lines.walk, l) : pose(lines.main, len - 2 * GAP));
          if (f >= 1 && !clean) { clean = true; cleanTick(); }
        }
      }
      if (len < b.mainLen - .5) requestAnimationFrame(frame);
      else {
        // the train pulls in and leaves the terminus to its sign
        state = 'done';
        Object.values(trains).forEach((g) => g.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }));
        const tag = b.items[b.items.length - 1];
        pop(tag);
        tag.label.animate([{ transform: tag.label.style.transform + ' rotate(0)' }, { transform: tag.label.style.transform + ' rotate(-4deg) scale(1.08)' }, { transform: tag.label.style.transform }],
          { duration: 500, easing: 'cubic-bezier(.2, .9, .3, 1.3)' });
      }
    };
    requestAnimationFrame(frame);
  }

  // A change of stage (the home page shrinking its frame to the stage, a phone turned, fonts
  // arriving, a label growing) can move the stations. Before the run that only redraws the empty
  // map; during it the day starts again on the new map; after it the finished map is redrawn.
  const relayout = () => {
    const was = built && built.L;
    const moved = place();
    if (built.L === was && !moved) return;
    if (state === 'running') play();
    else if (state === 'done') still();
    else prime();
  };
  let pending = 0;
  const soon = () => { if (!pending) pending = requestAnimationFrame(() => { pending = 0; relayout(); }); };
  const labelsSeen = window.ResizeObserver ? new ResizeObserver(soon) : null;
  if (labelsSeen) { labelsSeen.observe(map); }
  addEventListener('resize', soon);

  place();
  prime();
  // The day starts once the page is on screen with its fonts; the button starts it again.
  const begin = () => play();
  $('.replay').addEventListener('click', begin);
  TTY.onPlay(() => { if (state === 'idle') begin(); });
  TTY.drawn.then(() => { relayout(); TTY.ready(); });
})();
</script>
</body>
</html>
